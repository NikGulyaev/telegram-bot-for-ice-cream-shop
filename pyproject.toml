[project]
name = "ice-cream-bot"
version = "0.1.0"
description = ""
authors = [
    {name = "Nikolaj Gulyaev", email = "ns.gulyaev@yandex.ru"}
]
packages = [
    { include = "ice_cream_bot" }
]
requires-python = ">=3.12"

# Сюда кладем только простые зависимости без сложной логики, 
# либо оставляем пустым, если всё вынесено ниже.
dependencies = []

[tool.poetry.dependencies]
# Сложная зависимость: версия + extras (job-queue И callback-data)
python-telegram-bot = { version = ">=22.0,<23.0", extras = ["job-queue", "callback-data"] }

pydantic-settings = ">=2.14.2,<3.0.0"
psycopg2 = ">=2.9.12,<3.0.0"
asyncpg = ">=0.31.0,<0.32.0"
# Для SQLAlchemy тоже лучше использовать явный синтаксис, чтобы избежать путаницы
sqlalchemy = { version = ">=2.0.51,<3.0.0", extras = ["asyncio"] }
sqladmin = ">=0.27.2,<0.28.0"
itsdangerous = ">=2.2.0,<3.0.0"
uvicorn = ">=0.49.0,<0.50.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "asyncpg-stubs>=0.31.2,<0.32.0 ; python_version >= '3.12' and python_version < '4.0'"
]
